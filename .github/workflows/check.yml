name: Check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: packed files are current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Packed with the system at this ref: the ref is the system version this library is written against.
      - uses: enumeratio/enumeratio/.github/actions/pack-library@c1da285ceba71b42ad890ef4a352cd069851b3af # main after #580
